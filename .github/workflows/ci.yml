# PR + main gate for wicked-crew (lint · typecheck · build · test).
#
# Until this existed, wicked-crew had NO build/test on PRs — only GitGuardian. Merges rode on
# locally-run tests.
#
# `build` runs crew's `build:with-studio` (task #84 severed the default `build` down to plain `tsc`;
# task #98 carved the studio SPA out to its own repo — github.com/mikeparcewski/wicked-studio — so
# it is a separate product now, not a workspace member). `build:with-studio` runs
# scripts/bundle-studio.mjs, which copies the INSTALLED `wicked-studio` package's dist/ into
# packages/crew/dist/studio — so CI still proves the serving bundle assembles from the published
# artifact, which is what the release tarball ships. Studio's own lint/typecheck/test run in its
# own repo's CI.
#
# ── Why this checks out two sibling repos ────────────────────────────────────────────────────────
#
# `packages/crew` declares `wicked-core-ts` from npm, but the engine this package is developed
# against is the sibling `wicked-core` checkout, many merged PRs ahead of any publish. A plain
# `npm ci` therefore installed an engine OLDER than the code using it, and every path touching a
# field added since the last publish was untestable — not skipped, not reported, simply never
# reached.
#
# That produced a real false green: wicked-crew#184 shipped an onboarding launch path that throws on
# npm's 0.3.0 (it reads `code_graph_db`, added by wicked-core#170 and never published), and merged
# with CI passing, because no test touched it. CI proved that broken code compiles (FINDING-072,
# wicked-crew#187).
#
# So CI now builds `wicked-core-ts` from source and links it in. (wicked-estate needs no sibling
# checkout since wicked-core#245 — core resolves estate from crates.io.) `tests/engine-contract.test.ts`
# fails loudly if that linking ever silently stops happening.
#
# That fix has a blind spot, which is FINDING-088: because BOTH CI and local dev replace the
# installed engine with a source build, neither can observe the DECLARED range at all. It drifted
# to `^0.3.0` while the code targeted 0.4.0 — and for a 0.x package a caret pins the minor, so that
# range cannot install 0.4.0. Only an operator running `npm i wicked-crew` resolved it, and got an
# engine missing `runEvents`, `retirePolicy`, `retireConformanceRule` and `chatList`.
# `tests/engine-range-admits-built.test.ts` now compares the declared range against the version in
# `wicked-core/crates/wicked-core-ts` — which is why that checkout must stay available to the
# test job, not only to the build step.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The wicked-core revision crew is tested against. `main` is deliberate: these two repos move
  # together, and the point of building from source is to catch drift the day it lands rather than at
  # the next publish. Pin to a tag if crew ever needs to trail core. A pull_request may name a paired
  # core branch instead (the `wicked-core-ref:` PR-body marker, resolved by the `core_ref` step below,
  # crew#508); push to main and the release pipeline never do.
  WICKED_CORE_REF: main
  # Offline embedder — the memory engine must not download a model in CI (matches the tests' default).
  WICKED_MEMORY_EMBEDDER: hash

jobs:
  check:
    name: lint · typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wicked-crew
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wicked-crew

      # crew#508: a LOCKSTEP PR — a wire event and its mirror, a workflow def and its served copy — may
      # name the wicked-core ref it is built against, so the three drift guards
      # (builtin-overlay-shadow, armed-workflow-served, deliver-phase) judge it against the paired core
      # branch instead of staying red until core main moves. The marker is one line of the PR body:
      #
      #     wicked-core-ref: <branch>
      #
      # Honoured ONLY on pull_request events, and ONLY when <branch> is the head of an OPEN PR on
      # mikeparcewski/wicked-core itself (not a fork): a typo, a stranger's ref or a branch with no PR
      # fails THIS step, loudly. A marker whose core PR has MERGED resolves to the default instead —
      # that is the post-merge re-run against main the pairing needs, with no body edit. The effective
      # ref is a check annotation and the job summary, so a reviewer sees what the PR was judged
      # against. push to main, tags and the release pipeline never read the marker
      # (scripts/fetch-core-checkout.mjs keeps main; tests/core-checkout-policy.test.ts pins all of it).
      - name: Resolve the wicked-core ref (`wicked-core-ref:` PR-body marker, crew#508)
        id: core_ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # Through env, never interpolated into the script: a PR body is attacker-controlled text.
          PR_BODY: ${{ github.event.pull_request.body }}
          DEFAULT_REF: ${{ env.WICKED_CORE_REF }}
          CORE_REPO: mikeparcewski/wicked-core
        run: |
          set -euo pipefail
          ref="$DEFAULT_REF"
          source="the workflow default"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # First marker line wins; CRLF bodies are fine ([[:space:]] eats the \r). Fenced code blocks
            # (``` / ~~~) are dropped first so a body that QUOTES the marker — this workflow's own
            # documentation, a PR template example — is not a body that USES it (codex on #839).
            marker="$(printf '%s\n' "$PR_BODY" \
              | sed -E "/^[[:space:]]*(\`\`\`|~~~)/,/^[[:space:]]*(\`\`\`|~~~)/d" \
              | sed -nE 's/^[[:space:]]*wicked-core-ref:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' | head -n 1)"
            if [ -n "$marker" ]; then
              case "$marker" in
                *..*|-*|/*|*/|*.lock) echo "::error::wicked-core-ref marker '$marker' is not a plausible branch name"; exit 1 ;;
              esac
              if ! printf '%s' "$marker" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
                echo "::error::wicked-core-ref marker '$marker' is not a plausible branch name"; exit 1
              fi
              # One query: every PR whose head is this branch of the core repo itself (forks excluded).
              owner="${CORE_REPO%%/*}"
              prs="$(gh api "repos/${CORE_REPO}/pulls?state=all&head=${owner}:${marker}&per_page=30" \
                --jq "[.[] | select(.head.repo.full_name == \"${CORE_REPO}\") | {number, state, merged: (.merged_at != null)}]")"
              open_pr="$(jq -r '[.[] | select(.state == "open")][0].number // empty' <<<"$prs")"
              merged_pr="$(jq -r '[.[] | select(.merged)][0].number // empty' <<<"$prs")"
              if [ -n "$open_pr" ]; then
                ref="$marker"
                source="the PR-body marker (open ${CORE_REPO}#${open_pr})"
              elif [ -n "$merged_pr" ]; then
                source="the workflow default — the marker's branch '$marker' is ${CORE_REPO}#${merged_pr}, already MERGED (post-merge re-run)"
              else
                echo "::error::wicked-core-ref marker '$marker' is not the head branch of an open ${CORE_REPO} pull request"
                exit 1
              fi
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "::notice title=wicked-core ref::$ref — from $source"
          {
            echo "### wicked-core ref"
            echo
            echo "\`$ref\` — from $source"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout wicked-core (source of the engine addon)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: mikeparcewski/wicked-core
          ref: ${{ steps.core_ref.outputs.ref }}
          path: wicked-core

      # No estate sibling checkout: wicked-core resolves wicked-estate from crates.io (published
      # semver deps, wicked-core#245 — its `lockstep.rs` guards that no workflow reintroduces a raw
      # estate ref). This job used to read WICKED_ESTATE_REF out of wicked-core's own CI and check
      # estate out as a second sibling; when core#245 removed that constant, the reader here failed
      # closed (by design) and took every crew PR and main push with it. The registry release the
      # napi build compiles against is the same one wicked-core's own CI and releases resolve.

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wicked-crew/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wicked-core/crates/wicked-core-ts

      # napi build --platform --release, emitting wicked-core-ts.<triple>.node into the package dir.
      - name: Build wicked-core-ts from source
        working-directory: wicked-core/crates/wicked-core-ts
        run: npm install && npm run build

      - name: Install (clean, from lockfile)
        working-directory: wicked-crew
        run: npm ci

      # Overwrites node_modules/wicked-core-ts with the build above. Same script developers run
      # locally, so the two paths cannot drift.
      - name: Link the locally-built engine
        working-directory: wicked-crew
        run: node scripts/use-local-core-ts.mjs
        env:
          WICKED_CORE_TS_DIR: ${{ github.workspace }}/wicked-core/crates/wicked-core-ts

      # wicked-core#433: before the deliver phase pushes, the engine re-runs the repository's checks
      # whenever the worktree's tree is not the tree the run verified — INSIDE an OS write boundary
      # (Linux: bwrap), failing closed without one ("no OS write boundary could be armed"). The deliver
      # e2e suites (deliver-e2e, deliver-conflict-strand-e2e) drive a real deliver through the real
      # engine, so the runner needs the tool; ubuntu-24.04 images gate unprivileged user namespaces
      # behind AppArmor, which bwrap needs. The smoke line fails THIS step, not a test, if the
      # boundary cannot be armed.
      - name: Arm the checks sandbox (bubblewrap) for the engine's repo-checks floor
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent -- /bin/true
          echo "bwrap can arm a boundary on this runner"

      - name: Lint (eslint)
        working-directory: wicked-crew
        run: npm run -w packages/crew lint

      - name: Typecheck (tsc --noEmit)
        working-directory: wicked-crew
        run: npm run -w packages/crew typecheck

      # Copies the installed wicked-studio package's dist into packages/crew/dist/studio (the
      # serving artifact). Deliberately `build:with-studio`, not the default `build` (which is
      # plain tsc, task #84): CI must keep proving the release-shaped bundle assembles.
      - name: Build (crew + bundled studio dist)
        working-directory: wicked-crew
        run: npm run -w packages/crew build:with-studio

      - name: Test
        working-directory: wicked-crew
        run: npm run -w packages/crew test
