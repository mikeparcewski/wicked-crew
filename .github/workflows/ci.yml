# PR + main gate for wicked-crew (lint · typecheck · build · test).
#
# Until this existed, wicked-crew had NO build/test on PRs — only GitGuardian. Merges rode on
# locally-run tests.
#
# `build` runs crew's `build:with-studio` (task #84 severed the default `build` down to plain `tsc`;
# the studio SPA is an independent client and is no longer built as a side effect of building the
# daemon). `build:with-studio` runs scripts/bundle-studio.mjs (builds the studio SPA + copies its
# dist into packages/crew/dist/studio) — so CI still proves the v0.2.0 serving bundle assembles,
# which is what the release tarball ships.
#
# ── Why this checks out two sibling repos ────────────────────────────────────────────────────────
#
# `packages/crew` declares `wicked-core-ts` from npm, but the engine this package is developed
# against is the sibling `wicked-core` checkout, many merged PRs ahead of any publish. A plain
# `npm ci` therefore installed an engine OLDER than the code using it, and every path touching a
# field added since the last publish was untestable — not skipped, not reported, simply never
# reached.
#
# That produced a real false green: wicked-crew#184 shipped an onboarding launch path that throws on
# npm's 0.3.0 (it reads `code_graph_db`, added by wicked-core#170 and never published), and merged
# with CI passing, because no test touched it. CI proved that broken code compiles (FINDING-072,
# wicked-crew#187).
#
# So CI now builds `wicked-core-ts` from source and links it in. (wicked-estate needs no sibling
# checkout since wicked-core#245 — core resolves estate from crates.io.) `tests/engine-contract.test.ts`
# fails loudly if that linking ever silently stops happening.
#
# That fix has a blind spot, which is FINDING-088: because BOTH CI and local dev replace the
# installed engine with a source build, neither can observe the DECLARED range at all. It drifted
# to `^0.3.0` while the code targeted 0.4.0 — and for a 0.x package a caret pins the minor, so that
# range cannot install 0.4.0. Only an operator running `npm i wicked-crew` resolved it, and got an
# engine missing `runEvents`, `retirePolicy`, `retireConformanceRule` and `chatList`.
# `tests/engine-range-admits-built.test.ts` now compares the declared range against the version in
# `wicked-core/crates/wicked-core-ts` — which is why that checkout must stay available to the
# test job, not only to the build step.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The wicked-core revision crew is tested against. `main` is deliberate: these two repos move
  # together, and the point of building from source is to catch drift the day it lands rather than at
  # the next publish. Pin to a tag if crew ever needs to trail core.
  WICKED_CORE_REF: main
  # Offline embedder — the memory engine must not download a model in CI (matches the tests' default).
  WICKED_MEMORY_EMBEDDER: hash

jobs:
  check:
    name: lint · typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wicked-crew
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wicked-crew

      - name: Checkout wicked-core (source of the engine addon)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: mikeparcewski/wicked-core
          ref: ${{ env.WICKED_CORE_REF }}
          path: wicked-core

      # No estate sibling checkout: wicked-core resolves wicked-estate from crates.io (published
      # semver deps, wicked-core#245 — its `lockstep.rs` guards that no workflow reintroduces a raw
      # estate ref). This job used to read WICKED_ESTATE_REF out of wicked-core's own CI and check
      # estate out as a second sibling; when core#245 removed that constant, the reader here failed
      # closed (by design) and took every crew PR and main push with it. The registry release the
      # napi build compiles against is the same one wicked-core's own CI and releases resolve.

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wicked-crew/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wicked-core/crates/wicked-core-ts

      # napi build --platform --release, emitting wicked-core-ts.<triple>.node into the package dir.
      - name: Build wicked-core-ts from source
        working-directory: wicked-core/crates/wicked-core-ts
        run: npm install && npm run build

      - name: Install (clean, from lockfile)
        working-directory: wicked-crew
        run: npm ci

      # Overwrites node_modules/wicked-core-ts with the build above. Same script developers run
      # locally, so the two paths cannot drift.
      - name: Link the locally-built engine
        working-directory: wicked-crew
        run: node scripts/use-local-core-ts.mjs
        env:
          WICKED_CORE_TS_DIR: ${{ github.workspace }}/wicked-core/crates/wicked-core-ts

      - name: Lint (eslint — both packages)
        working-directory: wicked-crew
        run: npm run -w packages/crew lint && npm run -w packages/studio lint

      - name: Typecheck (tsc --noEmit — both packages)
        working-directory: wicked-crew
        run: npm run -w packages/crew typecheck && npm run -w packages/studio typecheck

      # Builds the studio SPA and bundles it into packages/crew/dist/studio (the v0.2.0 serving
      # artifact). Deliberately `build:with-studio`, not the default `build` (which is plain tsc,
      # task #84): CI must keep proving the release-shaped bundle assembles.
      - name: Build (crew + studio bundle)
        working-directory: wicked-crew
        run: npm run -w packages/crew build:with-studio

      - name: Test (both packages)
        working-directory: wicked-crew
        run: npm run -w packages/crew test && npm run -w packages/studio test
