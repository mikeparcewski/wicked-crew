# agent-acp-bridges — npm release (FINDING-096).
#
# ── Why this workflow exists ────────────────────────────────────────────────────────────────────
#
# `packages/crew` declares `agent-acp-bridges: ^1.0.0` as a RUNTIME dependency, and has since
# 0.3.x. The package is a workspace member, so it resolves from the workspace in CI, in local dev,
# and in the release job's own test step. It was never published to npm.
#
# The consequence went unnoticed through every release: a clean
#
#     npm install wicked-crew
#
# in an empty project aborts with `404 agent-acp-bridges@^1.0.0`. Every published wicked-crew has
# been uninstallable. Nothing could observe it, because no path ever installed the ARTIFACT from a
# clean registry — every path resolves the dependency from the workspace. The release pipeline
# tested the repo; it never tested the product.
#
# The bridge is not incidental: `packages/crew/src/core/bridge-path.ts` documents that the ACP
# bridges "ship as npm packages (dependencies of this package)" so their launcher shims land in
# `node_modules/.bin` and the engine can spawn them by bare name. crew declares FOUR bridge
# packages; three are external and published —
#
#   @agentclientprotocol/claude-agent-acp   -> claude-agent-acp
#   @agentclientprotocol/codex-acp          -> codex-acp
#   pi-acp                                  -> pi-acp
#
# — and the fourth is this one, ours, providing `agy-acp` for Antigravity. It is the only declared
# bridge that was never published. (bridge-path.ts's prose also names `opencode-acp`, which NO
# declared package provides and which produces no shim — stale documentation, filed as FINDING-097
# and deliberately not fixed here.)
#
# ── Why this is self-contained rather than a wicked-ci caller ───────────────────────────────────
#
# The first attempt called `wicked-ci/node-release.yml`, which failed before publishing:
#
#     npm error Invalid version: bridges-v1.0.0
#
# That workflow derives the version with `${GITHUB_REF_NAME#v}` — a leading `v` only, so it
# supports exactly one tag namespace per repo, and `v*` already belongs to wicked-crew itself.
#
# wicked-core hit the identical problem publishing a second package from one repo and solved it the
# same way this does: `napi-release.yml` is self-contained and strips its own `core-ts-v` prefix.
# Following that precedent keeps a one-package tag-scheme quirk out of shared infrastructure that
# five products depend on.
#
# Publishing this RETROACTIVELY fixes already-published crew versions: they declare `^1.0.0`, so
# once 1.0.0 exists on the registry, `npm install wicked-crew@0.4.0` resolves. No crew re-release
# is required.

name: Release bridges

on:
  push:
    tags:
      - 'bridges-v*'

permissions:
  contents: write
  # OIDC trusted publishing + `npm publish --provenance`, the same tokenless path wicked-crew and
  # wicked-core-ts already use. Neither repo holds an NPM_TOKEN.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-acp-bridges
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # `npm publish --provenance` needs a newer npm than the runner ships.
      - name: Upgrade npm (provenance-capable)
        run: npm install -g npm@latest
        working-directory: .

      # The workspace install is what vitest needs; this package has no build step (`files` is the
      # two committed .mjs files), so there is nothing to compile before publish.
      - name: Install workspace
        run: npm install
        working-directory: .

      - name: Test
        run: npm test

      # The tag and the manifest must agree. Deriving the version from the tag and stamping it
      # silently would let `bridges-v9.9.9` publish whatever the manifest happens to say — the
      # tag would then describe a release that does not exist. Compare instead, and fail loudly.
      - name: Tag and manifest must agree
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#bridges-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "  tag      : ${GITHUB_REF_NAME}  -> ${TAG_VERSION}"
          echo "  manifest : ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies ${TAG_VERSION} but package.json says ${PKG_VERSION}. Bump the manifest and re-tag rather than publishing a version the tag does not name."
            exit 1
          fi

      - name: Publish to npm (trusted publisher + provenance)
        run: npm publish --access public --provenance

      # Prove the thing that FINDING-096 is actually about: not "publish exited 0", but "an
      # operator can now obtain it". The registry is eventually consistent, so retry briefly.
      - name: The registry can actually serve it
        working-directory: .
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#bridges-v}"
          for i in 1 2 3 4 5 6; do
            if npm view "agent-acp-bridges@${TAG_VERSION}" version; then
              echo "  ok — obtainable from the registry"
              exit 0
            fi
            echo "  not visible yet (attempt $i), waiting…"
            sleep 10
          done
          echo "::error::agent-acp-bridges@${TAG_VERSION} is still not resolvable after publish. This is the exact failure mode FINDING-096 describes: a green publish for something no operator can install."
          exit 1
