# agent-acp-bridges — npm release (FINDING-096).
#
# ── Why this workflow exists ────────────────────────────────────────────────────────────────────
#
# `packages/crew` declares `agent-acp-bridges: ^1.0.0` as a RUNTIME dependency, and has since
# 0.3.x. The package is a workspace member, so it resolves from the workspace in CI, in local dev,
# and in the release job's own test step. It was never published to npm.
#
# The consequence went unnoticed through every release: a clean
#
#     npm install wicked-crew
#
# in an empty project aborts with `404 agent-acp-bridges@^1.0.0`. Every published wicked-crew has
# been uninstallable. Nothing could observe it, because no path ever installed the ARTIFACT from a
# clean registry — every path resolves the dependency from the workspace. The release pipeline
# tested the repo; it never tested the product.
#
# The bridge is not incidental: `packages/crew/src/core/bridge-path.ts` documents that the ACP
# bridges "ship as npm packages (dependencies of this package)" so their launcher shims land in
# `node_modules/.bin` and the engine can spawn them by bare name. crew declares FOUR bridge
# packages; three are external and published —
#
#   @agentclientprotocol/claude-agent-acp   -> claude-agent-acp
#   @agentclientprotocol/codex-acp          -> codex-acp
#   pi-acp                                  -> pi-acp
#
# — and the fourth is this one, ours, providing `agy-acp` for Antigravity. It is the only declared
# bridge that was never published. (bridge-path.ts's prose also names `opencode-acp`, which NO
# declared package provides and which produces no shim — stale documentation, filed as FINDING-097
# and deliberately not fixed here.)
#
# ── Why this is self-contained rather than a wicked-ci caller ───────────────────────────────────
#
# The first attempt called `wicked-ci/node-release.yml`, which failed before publishing:
#
#     npm error Invalid version: bridges-v1.0.0
#
# That workflow derives the version with `${GITHUB_REF_NAME#v}` — a leading `v` only, so it
# supports exactly one tag namespace per repo, and `v*` already belongs to wicked-crew itself.
#
# wicked-core hit the identical problem publishing a second package from one repo and solved it the
# same way this does: `napi-release.yml` is self-contained and strips its own `core-ts-v` prefix.
# Following that precedent keeps a one-package tag-scheme quirk out of shared infrastructure that
# five products depend on.
#
# Publishing this RETROACTIVELY fixes already-published crew versions: they declare `^1.0.0`, so
# once 1.0.0 exists on the registry, `npm install wicked-crew@0.4.0` resolves. No crew re-release
# is required.

name: Release bridges

on:
  push:
    tags:
      - 'bridges-v*'

permissions:
  # `contents: read` deliberately: this workflow creates no release, pushes no tag and opens no PR,
  # so write would be privilege it never exercises (review).
  contents: read
  # OIDC trusted publishing + `npm publish --provenance`, the same tokenless path wicked-crew and
  # wicked-core-ts already use. Neither repo holds an NPM_TOKEN.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Read by the `probe` job below (#514).
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.publish.outputs.published }}
    defaults:
      run:
        working-directory: packages/agent-acp-bridges
    steps:
      # SHA-pinned to match ci.yml — a release workflow is the last place to float an action tag.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Match ci.yml. Releasing on a different Node major than the one that proved the code
          # green is the same class of mismatch as FINDING-072 (review).
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # `npm publish --provenance` and OIDC trusted publishing need a newer npm than the runner
      # ships. Pinned to a MAJOR rather than `@latest`: npm 12.0.2 shipped recently, so `@latest`
      # silently changes major underneath a release job — the exact non-reproducibility review
      # flagged. 12 is the major that published wicked-core-ts 0.4.1 through this same tokenless
      # path today, so it is known-good here rather than merely current.
      - name: Upgrade npm (provenance-capable)
        run: npm install -g npm@12
        working-directory: .

      # The workspace install is what vitest needs; this package has no build step (`files` is the
      # two committed .mjs files), so there is nothing to compile before publish.
      #
      # `npm ci` rather than `npm install`, matching ci.yml: a release must install what the
      # lockfile pins, not whatever resolves at release time (review).
      - name: Install workspace
        run: npm ci
        working-directory: .

      - name: Test
        run: npm test

      # The tag and the manifest must agree. Deriving the version from the tag and stamping it
      # silently would let `bridges-v9.9.9` publish whatever the manifest happens to say — the
      # tag would then describe a release that does not exist. Compare instead, and fail loudly.
      - name: Tag and manifest must agree
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#bridges-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "  tag      : ${GITHUB_REF_NAME}  -> ${TAG_VERSION}"
          echo "  manifest : ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies ${TAG_VERSION} but package.json says ${PKG_VERSION}. Bump the manifest and re-tag rather than publishing a version the tag does not name."
            exit 1
          fi
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      # The log is kept so the `probe` job can tell "published, registry still processing" apart
      # from "never published": npm ends a successful publish with the line `+ <pkg>@<ver>` (#514).
      # `pipefail` so a failed publish still fails this step through the tee.
      - name: Publish to npm (trusted publisher + provenance)
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          npm publish --access public --provenance 2>&1 | tee "$RUNNER_TEMP/npm-publish.log"
          if grep -Fq -- "+ agent-acp-bridges@${VERSION}" "$RUNNER_TEMP/npm-publish.log"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Prove the registry can actually serve the package — not just that publish exited 0 ──────────
  #
  # A separate JOB rather than a step of `release` (#514): npm processes a publish asynchronously
  # and its own notice says "may take a few minutes"; 0.31.0 took ~8 min to become resolvable (run
  # 34524261398), so the old in-job 6 × 10 s probe reported a successful release as a failed run —
  # and "Re-run failed jobs" would have re-run `npm publish` too (EPUBLISHCONFLICT). As its own job
  # the probe can be re-run alone, with the release job's outputs telling it whether the publish
  # step actually reported `+ <pkg>@<ver>`, so the failure names the real cause.
  # release-api-types.yml carries the identical probe job (it mirrored this one, FINDING-096): keep
  # the two shell blocks identical — only the job `env` differs.
  probe:
    name: The registry can actually serve it
    needs: release
    # Runs even when `release` FAILED (Copilot on #520): under the default success condition a failed
    # `npm publish` would leave this job skipped, and the message naming the real publish failure
    # would never print. Guarded on the version output so a failure before the tag check (nothing to
    # probe for) still skips; `!cancelled()` rather than `always()` so a cancelled run stays cancelled.
    if: ${{ !cancelled() && needs.release.outputs.version != '' }}
    runs-on: ubuntu-latest
    # No checkout and no OIDC: `npm view` against the public registry needs neither.
    permissions: {}
    env:
      PACKAGE: agent-acp-bridges
      VERSION: ${{ needs.release.outputs.version }}
      PUBLISHED: ${{ needs.release.outputs.published }}
      PROBE_MAX_MINUTES: '10'
      PROBE_INTERVAL_SECONDS: '30'
    steps:
      - name: Poll until the registry resolves the version (up to 10 min)
        run: |
          # `timeout 60` on every lookup: npm's own fetch timeout is 5 min with retries, so an
          # unbounded `npm view` could outlive the deadline below (Copilot on #520).
          #
          # PUBLISHED is empty when the publish step failed or never ran. One look at the registry
          # tells the two failures apart: a re-run of an already-published tag fails `npm publish`
          # with EPUBLISHCONFLICT although the version is obtainable — the very re-run #514 warns
          # against — whereas a real publish failure leaves nothing to poll for.
          if [ -z "$PUBLISHED" ]; then
            if served="$(timeout 60 npm view --prefer-online "${PACKAGE}@${VERSION}" version)" \
               && [ "$served" = "$VERSION" ]; then
              echo "::warning::the release job's publish step failed, yet the registry already serves ${PACKAGE}@${VERSION}: a re-run of an already-published tag (npm refuses to publish over an existing version, EPUBLISHCONFLICT). The release is fine; the failed publish step belongs to the re-run, not to the release."
              exit 0
            fi
            echo "::error::the release job's publish step failed or did not run, and the registry does not serve ${PACKAGE}@${VERSION}: a REAL publish failure. Nothing to poll for — read the release job's publish step log; re-running this probe cannot fix it."
            exit 1
          fi
          # `--prefer-online`: the registry serves packuments with `cache-control: max-age=300`, so
          # without it a 30 s poll can keep re-reading the stale, pre-publish packument from npm's
          # local cache for five minutes after the registry has caught up.
          started="$(date +%s)"
          deadline=$(( started + PROBE_MAX_MINUTES * 60 ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            if served="$(timeout 60 npm view --prefer-online "${PACKAGE}@${VERSION}" version)" \
               && [ "$served" = "$VERSION" ]; then
              echo "  ok — ${PACKAGE}@${VERSION} is obtainable from the registry after $(( $(date +%s) - started ))s (attempt ${attempt})"
              if [ "$PUBLISHED" != "true" ]; then
                echo "::warning::npm publish exited 0 without printing '+ ${PACKAGE}@${VERSION}', yet the registry serves that version. Check the release job's publish log — the success marker this probe keys on may have changed shape."
              fi
              exit 0
            fi
            now="$(date +%s)"
            if [ "$now" -ge "$deadline" ]; then
              break
            fi
            echo "  not visible yet — attempt ${attempt}, $(( now - started ))s elapsed of ${PROBE_MAX_MINUTES} min; next check in ${PROBE_INTERVAL_SECONDS}s"
            sleep "$PROBE_INTERVAL_SECONDS"
          done
          if [ "$PUBLISHED" = "true" ]; then
            echo "::error::${PACKAGE}@${VERSION} WAS published (npm publish reported '+ ${PACKAGE}@${VERSION}') but the registry has not finished processing it after ${PROBE_MAX_MINUTES} minutes. Re-run ONLY this job (Re-run failed jobs) — never the release job: a second npm publish of the same version fails with EPUBLISHCONFLICT."
          else
            echo "::error::npm publish did not report '+ ${PACKAGE}@${VERSION}' and the registry does not serve it after ${PROBE_MAX_MINUTES} minutes: a REAL publish failure. Read the release job's publish step log; re-running this probe cannot fix it."
          fi
          exit 1
