# wicked-crew — npm release caller (DES-RELEASE-001 §2.3D + §9.4).
#
# This repo is an npm WORKSPACE: the root package `wicked-crew-workspace` is private and the
# publishable `wicked-crew` daemon lives in packages/crew — hence `publish_working_dir: packages/crew`
# (added to wicked-ci's node-release.yml on branch feat/publish-working-dir).
#
# PREREQUISITES — this is staged prep; a tag push will NOT go green until ALL of these land:
#   1. wicked-core-ts is on npm (push tag `core-ts-v0.1.0` in the wicked-core repo → napi-release.yml).
#   2. packages/crew's core-ts dep is flipped `file:../../../wicked-core/crates/wicked-core-ts` → `^0.1`
#      so a clean CI checkout resolves the native addon (+ its platform package) from npm.
#   3. wicked-ci `@v1` is re-tagged to include `publish_working_dir` (merge feat/publish-working-dir).
#   4. DONE (v0.2.0, DES-STUDIO-SERVING-001; re-wired by task #84; re-sourced by the #98 carve):
#      `scripts/bundle-studio.mjs` copies the INSTALLED `wicked-studio` package's `dist/` →
#      `packages/crew/dist/studio/`. Studio is its own product now
#      (github.com/mikeparcewski/wicked-studio, a devDependency of packages/crew consumed as a
#      dist artifact — no source in this repo). Nested under `dist/`, so the existing
#      `files: ["dist"]` carries it in the published tarball. Since task #84 the DEFAULT crew
#      `build` is plain `tsc`; the bundling lives in `build:with-studio`, which is what
#      `build_cmd` below runs — the PUBLISHED package still ships the studio UI, end users lose
#      nothing.
#
# os_matrix is narrowed to ubuntu+macos: the PTY terminal path is unix-first (Windows ConPTY parity is
# a wicked-core follow-up), so crew's terminal tests aren't Windows-clean yet. Widen when it is.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  release:
    uses: mikeparcewski/wicked-ci/.github/workflows/node-release.yml@v1
    with:
      package_name: wicked-crew
      publish_working_dir: packages/crew
      os_matrix: '["ubuntu-latest", "macos-latest"]'
      version_dirs: |
        .
        packages/crew
      build_cmd: 'npm install && npm run -w packages/crew build:with-studio'
      # The test job of wicked-ci's node-release.yml is a bare single-repo checkout, unlike crew's
      # own ci.yml which checks crew and wicked-core out as true siblings. Crew's cross-repo drift
      # guards read core's shipped artifacts, so without a sibling checkout they cannot run — and on
      # the v0.4.0 tag that meant one guard hard-failed (blocking the publish) while two others
      # silently skipped. Fetch the checkout so the release gates on the same evidence CI does
      # (FINDING-094). `tests/core-checkout-policy.test.ts` fails loudly if this ever stops working.
      install_cmd: 'node scripts/fetch-core-checkout.mjs && npm install'
      test_cmd: 'npm run -w packages/crew test'
      enable_sync_pr: true
    secrets: inherit
