# wicked-crew-api-types — npm release (P9 conditional #3).
#
# ── Why this workflow exists ────────────────────────────────────────────────────────────────────
#
# `wicked-studio` declared `wicked-crew-api-types` as a git reference
# (`github:mikeparcewski/wicked-crew#api-types-v0.1.0`), which means:
#   - Any operator cloning studio without prior npm-install history must have git access to the
#     wicked-crew repo — a private source tree is a dependency of a published package.
#   - `npm audit` cannot inspect the dependency tree past the git boundary.
#   - Pinning by commit/tag gives no semver range resolution; upstream breakage silently lurks.
#
# Publishing to the npm registry fixes all three: studio can declare `^0.2.0`, the dependency
# is public, auditable, and range-resolved like every other dep in the ecosystem.
#
# ── Why self-contained rather than a wicked-ci caller ───────────────────────────────────────────
#
# The shared `node-release.yml` strips a leading `v` from the tag (e.g. `v0.2.0` → `0.2.0`).
# This repo already owns `v*` for the main `wicked-crew` package.  A second tag namespace
# (`api-types-v*`) would need a different prefix strip, and wicked-ci's reusable workflow does
# not expose a `tag_prefix` parameter.  `release-bridges.yml` hit this exact constraint and went
# self-contained; this workflow follows the same precedent.

name: Release api-types

on:
  push:
    tags:
      - 'api-types-v*'

permissions:
  # No release notes, no sync PR — read access is all this job needs for the checkout.
  contents: read
  # OIDC trusted publishing + `npm publish --provenance`: the same tokenless path that
  # `wicked-crew` (node-release.yml) and `agent-acp-bridges` (release-bridges.yml) already use.
  # No NPM_TOKEN is stored in this repo.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Read by the `probe` job below (#514).
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.publish.outputs.published }}
    defaults:
      run:
        working-directory: packages/crew-api-types
    steps:
      # SHA-pinned to match ci.yml — a release workflow is the last place to float an action tag.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Match ci.yml. Releasing on a different Node major than CI proved green on is the
          # same class of mismatch as FINDING-072.
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # npm 12 is the major that published wicked-core-ts and agent-acp-bridges through this
      # tokenless OIDC path — pinned to a major, not @latest, for reproducibility.
      - name: Upgrade npm (provenance-capable)
        run: npm install -g npm@12
        working-directory: .

      # Workspace install to pull in the typescript devDependency used by the typecheck step.
      # `npm ci` — release must install what the lockfile pins, not whatever resolves today.
      - name: Install workspace
        run: npm ci
        working-directory: .

      # The package is declaration-only (index.d.ts).  The typecheck step compiles the
      # declarations against the tsconfig to catch any structural error before publish.
      - name: Typecheck
        run: npm run typecheck

      # Guard: the tag and the package.json version must agree exactly.  Deriving the version
      # from the tag and stamping silently would let `api-types-v9.9.9` publish whatever the
      # manifest happens to say.  Fail loudly instead.
      - name: Tag and manifest must agree
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#api-types-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "  tag      : ${GITHUB_REF_NAME}  -> ${TAG_VERSION}"
          echo "  manifest : ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies ${TAG_VERSION} but package.json says ${PKG_VERSION}. Bump the manifest and re-tag rather than publishing a version the tag does not name."
            exit 1
          fi
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      # The log is kept so the `probe` job can tell "published, registry still processing" apart
      # from "never published": npm ends a successful publish with the line `+ <pkg>@<ver>` (#514).
      # `pipefail` so a failed publish still fails this step through the tee.
      - name: Publish to npm (trusted publisher + provenance)
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          npm publish --access public --provenance 2>&1 | tee "$RUNNER_TEMP/npm-publish.log"
          if grep -Fq -- "+ wicked-crew-api-types@${VERSION}" "$RUNNER_TEMP/npm-publish.log"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Prove the registry can actually serve the package — not just that publish exited 0 ──────────
  #
  # A separate JOB rather than a step of `release` (#514): npm processes a publish asynchronously
  # and its own notice says "may take a few minutes"; 0.31.0 took ~8 min to become resolvable (run
  # 34524261398), so the old in-job 6 × 10 s probe reported a successful release as a failed run —
  # and "Re-run failed jobs" would have re-run `npm publish` too (EPUBLISHCONFLICT). As its own job
  # the probe can be re-run alone, with the release job's outputs telling it whether the publish
  # step actually reported `+ <pkg>@<ver>`, so the failure names the real cause.
  # Mirrors the probe job in release-bridges.yml (FINDING-096 precedent): keep the two shell blocks
  # identical — only the job `env` differs.
  probe:
    name: The registry can actually serve it
    needs: release
    # Runs even when `release` FAILED (Copilot on #520): under the default success condition a failed
    # `npm publish` would leave this job skipped, and the message naming the real publish failure
    # would never print. Guarded on the version output so a failure before the tag check (nothing to
    # probe for) still skips; `!cancelled()` rather than `always()` so a cancelled run stays cancelled.
    if: ${{ !cancelled() && needs.release.outputs.version != '' }}
    runs-on: ubuntu-latest
    # No checkout and no OIDC: `npm view` against the public registry needs neither.
    permissions: {}
    env:
      PACKAGE: wicked-crew-api-types
      VERSION: ${{ needs.release.outputs.version }}
      PUBLISHED: ${{ needs.release.outputs.published }}
      PROBE_MAX_MINUTES: '10'
      PROBE_INTERVAL_SECONDS: '30'
    steps:
      - name: Poll until the registry resolves the version (up to 10 min)
        run: |
          # `timeout 60` on every lookup: npm's own fetch timeout is 5 min with retries, so an
          # unbounded `npm view` could outlive the deadline below (Copilot on #520).
          #
          # PUBLISHED is empty when the publish step failed or never ran. One look at the registry
          # tells the two failures apart: a re-run of an already-published tag fails `npm publish`
          # with EPUBLISHCONFLICT although the version is obtainable — the very re-run #514 warns
          # against — whereas a real publish failure leaves nothing to poll for.
          if [ -z "$PUBLISHED" ]; then
            if served="$(timeout 60 npm view --prefer-online "${PACKAGE}@${VERSION}" version)" \
               && [ "$served" = "$VERSION" ]; then
              echo "::warning::the release job's publish step failed, yet the registry already serves ${PACKAGE}@${VERSION}: a re-run of an already-published tag (npm refuses to publish over an existing version, EPUBLISHCONFLICT). The release is fine; the failed publish step belongs to the re-run, not to the release."
              exit 0
            fi
            echo "::error::the release job's publish step failed or did not run, and the registry does not serve ${PACKAGE}@${VERSION}: a REAL publish failure. Nothing to poll for — read the release job's publish step log; re-running this probe cannot fix it."
            exit 1
          fi
          # `--prefer-online`: the registry serves packuments with `cache-control: max-age=300`, so
          # without it a 30 s poll can keep re-reading the stale, pre-publish packument from npm's
          # local cache for five minutes after the registry has caught up.
          started="$(date +%s)"
          deadline=$(( started + PROBE_MAX_MINUTES * 60 ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            if served="$(timeout 60 npm view --prefer-online "${PACKAGE}@${VERSION}" version)" \
               && [ "$served" = "$VERSION" ]; then
              echo "  ok — ${PACKAGE}@${VERSION} is obtainable from the registry after $(( $(date +%s) - started ))s (attempt ${attempt})"
              if [ "$PUBLISHED" != "true" ]; then
                echo "::warning::npm publish exited 0 without printing '+ ${PACKAGE}@${VERSION}', yet the registry serves that version. Check the release job's publish log — the success marker this probe keys on may have changed shape."
              fi
              exit 0
            fi
            now="$(date +%s)"
            if [ "$now" -ge "$deadline" ]; then
              break
            fi
            echo "  not visible yet — attempt ${attempt}, $(( now - started ))s elapsed of ${PROBE_MAX_MINUTES} min; next check in ${PROBE_INTERVAL_SECONDS}s"
            sleep "$PROBE_INTERVAL_SECONDS"
          done
          if [ "$PUBLISHED" = "true" ]; then
            echo "::error::${PACKAGE}@${VERSION} WAS published (npm publish reported '+ ${PACKAGE}@${VERSION}') but the registry has not finished processing it after ${PROBE_MAX_MINUTES} minutes. Re-run ONLY this job (Re-run failed jobs) — never the release job: a second npm publish of the same version fails with EPUBLISHCONFLICT."
          else
            echo "::error::npm publish did not report '+ ${PACKAGE}@${VERSION}' and the registry does not serve it after ${PROBE_MAX_MINUTES} minutes: a REAL publish failure. Read the release job's publish step log; re-running this probe cannot fix it."
          fi
          exit 1
